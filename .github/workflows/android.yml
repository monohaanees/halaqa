name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: cd android && gradle assembleDebug --no-daemon

      - name: Publish APK to dist
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/halaqa.apk
          git add dist/halaqa.apk
          if git diff --cached --quiet; then echo "no change"; else git commit -m "تحديث ملف APK تلقائياً من البناء" && git push; fi
