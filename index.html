.msg{font-size:13px;margin-top:6px}.err{color:var(--bad)}.wr{color:var(--wr)}

 if(c){const r=dr(c.dataset.n);if(t.dataset.k!==undefined)r.s[+t.dataset.k]=t.value;else if(t.dataset.nt)r.nt=t.value;else if(t.dataset.xd!==undefined)r.xd=t.value;else if(t.dataset.vd!==undefined)r.vd=t.value;save();upd(c);return}
